name: Build Android APK (debug)
 
on:
  workflow_dispatch:
  push:
    branches: [ main ]
 
env:
  CI: "true"
 
jobs:
  android:
    name: Android APK (no signing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      - name: 准备 Android SDK / NDK (强制清理并指定版本)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          
          # 1. 【关键】强制卸载系统预装的 NDK 30，防止编译脚本自动抓取
          echo "正在卸载冲突的 NDK 30..."
          yes | "$SDKM" --uninstall "ndk;30.0.16248370" 2>/dev/null || true
          
          # 2. 接受协议并安装指定的 NDK 28
          echo "正在安装 NDK 28..."
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          
          # 3. 设置所有相关的环境变量
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
 
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
 
      - name: 生成 Android 工程
        run: |
          pnpm tauri android init --ci
          # 【关键】强制将 NDK 路径写入 Gradle 配置文件，防止 Gradle 自动寻找错误版本
          echo "ndk.dir=$NDK_HOME" >> src-tauri/gen/android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> src-tauri/gen/android/local.properties
 
      - name: 编译 Debug APK（按 ABI 分包）
        run: |
          # 再次确保编译时的环境变量生效
          export ANDROID_NDK_HOME=$NDK_HOME
          export ANDROID_NDK_ROOT=$NDK_HOME
          
          # 清理可能存在的 Gradle 缓存
          cd src-tauri/gen/android
          ./gradlew clean
          cd ../../..
          
          # 执行编译
          pnpm tauri android build --apk --debug --split-per-abi --target aarch64 armv7 x86_64
 
      - name: 收集产物
        run: |
          mkdir -p artifacts
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" \
            -exec cp {} artifacts/ \;
          ls -lh artifacts
 
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-android-debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
