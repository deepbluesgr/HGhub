name: Build Android APK (debug)
 
on:
  workflow_dispatch:
  push:
    branches: [ main ]
 
env:
  CI: "true"
 
jobs:
  android:
    name: Android APK (no signing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      # 关键：直接复用 runner 自带的 Android SDK。
      # 官方注释说明不要使用 android-actions/setup-android，
      # 它的 license 交互会把任务卡死。
      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" \
            "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
 
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
 
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
 
      - name: 生成 Android 工程
        run: pnpm tauri android init --ci
 
      - name: 编译 Debug APK（按 ABI 分包）
        run: pnpm tauri android build --apk --debug --split-per-abi \
          --target aarch64 armv7 x86_64
 
      - name: 收集产物
        run: |
          mkdir -p artifacts
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" \
            -exec cp {} artifacts/ \;
          ls -lh artifacts
 
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-android-debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
